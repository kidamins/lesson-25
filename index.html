const sl=[{t:"title"},...W.map((w,i)=>({t:"w",w,i})),{t:"qi"},{t:"q"}];
let n=0,show=0,Q=[],qi=0,sc=0,done=0;
const $=id=>document.getElementById(id),card=$("card");
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function mkQ(T){const ps=sh(W),out=[];ps.slice(0,10).forEach((w,k)=>{const t=T[k%T.length],o=sh(W.filter(x=>x!==w)).slice(0,3),z=()=>sh([w,...o]).map(x=>x[0]);
if(t==0)out.push({q:`<div class="big zh" style="font-size:54px">${w[0]}</div><p class="c">${w[1]} แปลว่าอะไร?</p>`,a:w[2],o:sh([w,...o]).map(x=>x[2])});
else if(t==1)out.push({q:`<p class="c">เลือกคำจีนที่แปลว่า<br><b style="font-size:22px">${w[2]}</b></p>`,a:w[0],o:z()});
else if(t==2)out.push({q:`<p class="c">เติมคำในช่องว่าง</p><div class="zh c" style="font-size:24px">${w[4].replace(w[0],"＿＿")}</div><p class="c" style="color:var(--mut)">${w[6]}</p>`,a:w[0],o:z()});
else if(t==3)out.push({q:`<p class="c">พินอินนี้คือคำไหน?</p><div class="py" style="font-size:30px">${w[1]}</div>`,a:w[0],o:z()});
else if(t==4){const cs=[...w[0]].filter(c=>C[c]),c=cs[Math.floor(Math.random()*cs.length)],v=C[c],s=new Set([v]);while(s.size<4)s.add(Math.max(2,v+Math.floor(Math.random()*7)-3));out.push({q:`<div class="big zh" style="font-size:64px">${c}</div><p class="c">ตัวอักษรนี้มีกี่ขีด?</p>`,a:v+" ขีด",o:sh([...s]).map(x=>x+" ขีด")})}
else out.push({q:`<p class="c">ฟังแล้วเลือกคำที่ได้ยิน</p><p class="c"><button class="p" onclick="say('${w[0]}')">🔊 กดฟัง</button></p>`,a:w[0],o:z()})});return out}
function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;speechSynthesis.speak(u)}
let M="";
function start(m){M=m;qi=0;sc=0;done=0;Q=m=="listen"?mkQ([5]):mkQ([0,1,2,3,4,5]);n=sl.length-1;show=0;render()}
function run(){if(!M)return start("mix");if(M=="match")matchG();else if(M=="order")orderG();else quiz()}
function matchG(){const ps=sh(W).slice(0,6),R=sh(ps.map(w=>w[2])),map={};ps.forEach(w=>map[w[0]]=w[2]);let sel=null,ok=0,err=0;
card.innerHTML=`<h2>🔗 จับคู่คำกับความหมาย</h2><p class="c" id="mi">แตะคำจีนก่อน แล้วแตะความหมายที่ตรงกัน</p><div style="display:flex;gap:10px"><div style="flex:1" class="zh" id="ml">${ps.map(w=>`<button class="opt" data-k="${w[0]}">${w[0]}</button>`).join("")}</div><div style="flex:1" id="mr">${R.map(t=>`<button class="opt" data-k="${t}">${t}</button>`).join("")}</div></div>`;
card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(b.disabled)return;
if(b.parentNode.id=="ml"){card.querySelectorAll("#ml .opt").forEach(x=>x.style.outline="");sel=b;b.style.outline="3px solid var(--ac)";return}
if(!sel)return;
if(map[sel.dataset.k]==b.dataset.k){sel.classList.add("ok");b.classList.add("ok");sel.disabled=b.disabled=true;sel.style.outline="";sel=null;ok++;if(ok==6)$("mi").innerHTML=`🎉 จับคู่ครบ! ผิด ${err} ครั้ง <button class="p" onclick="matchG()">เล่นอีกรอบ</button>`}
else{err++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500)}})}
const SO=[["她","汉字","写","得","很好"],["他","跑","得","很快"],["你","愿意","跟我","去","中国","吗"],["我们","要","提高","汉语","水平"],["他","刚才","来了"],["因为","下雨","所以","我","不去"],["你","最近","进步","了","很多"],["今天","天气","这么","好"],["他的","发音","很","准"],["早上","我","去","公园","跑步"]];
function orderG(){const R=sh(SO).slice(0,5);let i=0,sc2=0;
function nxt(){if(i>=5){card.innerHTML=`<h2>🧩 ได้ ${sc2} / 5</h2><p class="c"><button class="p" onclick="orderG()">เล่นอีกรอบ</button></p>`;return}
const ch=R[i],ans=ch.join(""),hint=(W.find(w=>w[4].replace(/[。，？]/g,"").includes(ans))||[])[6]||"";let pick=[],pool=sh(ch.map((t,j)=>j));
function draw(){card.innerHTML=`<div class="pos">ข้อ ${i+1}/5 · คะแนน ${sc2}</div><h2>🧩 เรียงให้เป็นประโยค</h2><p class="c" style="color:var(--mut)">${hint}</p><div class="zh ex" style="min-height:56px;font-size:24px">${pick.map(j=>`<button data-r="${j}">${ch[j]}</button>`).join(" ")}</div><div class="zh" style="margin:12px 0">${pool.map(j=>`<button class="opt" style="display:inline-block;width:auto;margin:4px" data-a="${j}">${ch[j]}</button>`).join("")}</div><button class="p" id="chk">ตรวจคำตอบ</button><p class="c" id="rs"></p>`;
card.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const j=+b.dataset.a;pool=pool.filter(x=>x!=j);pick.push(j);draw()});
card.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const j=+b.dataset.r;pick=pick.filter(x=>x!=j);pool.push(j);draw()});
$("chk").onclick=()=>{const ok=pick.map(j=>ch[j]).join("")==ans;if(ok)sc2++;$("rs").innerHTML=ok?"✅ ถูกต้อง!":`❌ คำตอบ: <span class="zh">${ans}</span>`;$("chk").textContent="ข้อถัดไป →";$("chk").onclick=()=>{i++;nxt()}}}
draw()}
nxt()}
function sv(c,k,z){const d=D[c];return `<svg viewBox="0 0 1024 1024" width="${z}" height="${z}"><path d="M512 0V1024M0 512H1024" stroke="var(--bd)" stroke-width="10" stroke-dasharray="30 30"/><g transform="scale(1,-1) translate(0,-900)">${d.map(p=>`<path d="${p}" fill="var(--bd)" opacity=".5"/>`).join("")}${d.slice(0,k).map((p,i)=>`<path d="${p}" fill="${i==k-1?'var(--ac)':'var(--fg)'}"/>`).join("")}</g></svg>`}
function sb(c){const n=D[c].length;return `<div class="sb"><div class="zh"><b>${c}</b> · ${n} ขีด</div><div class="steps">${D[c].map((_,i)=>`<span>${sv(c,i+1,56)}<i>${i+1}</i></span>`).join("")}</div><button onclick="play('${c}',this)">▶ เล่นทีละขีด</button><span class="pl"></span></div>`}
let tm;function play(c,b){const t=b.nextElementSibling,n=D[c].length;let k=0;clearInterval(tm);tm=setInterval(()=>{k++;t.innerHTML=sv(c,k,110);if(k>=n)clearInterval(tm)},650)}
function chips(z){return[...z].filter(c=>C[c]).map(c=>`<span class="chip zh">${c} ${C[c]} ขีด</span>`).join("")}
function render(){const s=sl[n];$("bar").firstChild.style.width=n/(sl.length-1)*100+"%";$("cnt").textContent=`${n+1} / ${sl.length}`;
card.className="card"+(s.t=="title"?" cover":"");
if(s.t=="title")card.innerHTML=`<div class="fl"><span style="left:6%;top:8%">电</span><span style="right:8%;top:12%;animation-delay:.7s">努</span><span style="left:12%;bottom:10%;animation-delay:1.4s">球</span><span style="right:10%;bottom:12%;animation-delay:2.1s">进</span><span style="left:44%;top:3%;animation-delay:2.8s">快</span></div><p class="hero zh">汉语</p><h2>คำศัพท์ภาษาจีน 28 คำ</h2><div><span class="tag">📺 มีไวยากรณ์ 得</span><span class="tag">✍️ ลำดับขีดทีละเส้น</span><span class="tag">📝 แบบฝึกหัด</span></div><button onclick="go(1)">เริ่มเรียนเลย! 🚀</button>`;
else if(s.t=="w"){const w=s.w,big=[...w[0]].some(c=>C[c]>=10||S[c]);
card.innerHTML=`<div class="pos">${s.i+1}/28 · ${w[3]}</div><div class="big zh">${w[0]}</div><div class="py">${w[1]}</div><div class="th">${w[2]}</div>
<div class="ex"><div class="zh">${w[4]}</div><div style="color:var(--mut)">${w[5]}</div><div class="${show?"":"hid"}" onclick="show=1;render()">${w[6]}</div></div>
${w[7]?`<div class="note">💡 ${w[7]}</div>`:""}
<div class="use">📌 <b>วิธีใช้</b><br>${U[w[0]]}</div>
<div class="st"><b>✍️ ลำดับขีด</b> <span style="color:var(--mut);font-size:13px">(เลขในช่อง = ลำดับ · สีแดง = ขีดที่เพิ่งเขียน)</span> ${[...new Set(w[0])].filter(c=>D[c]).map(c=>sb(c)).join('')}${[...w[0]].filter(c=>S[c]).map(c=>`<div class="zh">• <b>${c}</b> (${C[c]} ขีด): ${S[c]}</div>`).join("")}${big?`<div class="note">หลักทั่วไป: ซ้ายก่อนขวา · บนก่อนล่าง · ขวางก่อนตั้ง · ผ่านกลางก่อนปิดล่าง</div>`:""}</div>`}
else if(s.t=="qi"){Q=[];M="";card.innerHTML=`<h2>📝 แบบฝึกหัด</h2><p class="c">เลือกรูปแบบที่อยากทำ</p><button class="opt" onclick="start('mix')">🎲 <b>แบบผสม 10 ข้อ</b><br><small>ความหมาย · พินอิน · เติมคำ · จำนวนขีด · ฟังเสียง</small></button><button class="opt" onclick="start('listen')">🎧 <b>ฟังแล้วเลือกคำ</b><br><small>10 ข้อ ฝึกฟังเสียงภาษาจีน</small></button><button class="opt" onclick="start('match')">🔗 <b>จับคู่คำกับความหมาย</b><br><small>6 คู่ แตะซ้าย-ขวา</small></button><button class="opt" onclick="start('order')">🧩 <b>เรียงประโยค</b><br><small>5 ข้อ เรียงคำให้เป็นประโยคที่ถูกต้อง</small></button>`}
else run()}
function quiz(){if(qi>=Q.length){card.innerHTML=`<h2>ได้ ${sc} / ${Q.length}</h2><p class="c">${sc>=8?"ยอดเยี่ยม! 🎉":sc>=5?"ดีแล้ว ทบทวนอีกนิดนะ":"ลองย้อนดูสไลด์อีกรอบ 💪"}</p><p class="c"><button class="p" onclick="n=sl.length-2;render()">ทำใหม่</button></p>`;return}
const q=Q[qi];done=0;card.innerHTML=`<div class="pos">ข้อ ${qi+1}/10 · คะแนน ${sc}</div>${q.q}<div class="zh">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>`;
card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;done=1;const ok=b.textContent==q.a;if(ok)sc++;b.classList.add(ok?"ok":"no");card.querySelectorAll(".opt").forEach(x=>{if(x.textContent==q.a)x.classList.add("ok")});setTimeout(()=>{qi++;quiz()},1100)})}
function go(d){n=Math.max(0,Math.min(sl.length-1,n+d));show=0;render()}
$("nx").onclick=()=>go(1);$("pv").onclick=()=>go(-1);
$("sp").onclick=()=>{const s=sl[n];if(s.t!="w"||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.w[0]+"。"+s.w[4]);u.lang="zh-CN";u.rate=.8;speechSynthesis.speak(u)};
document.onkeydown=e=>{if(e.key=="ArrowRight")go(1);if(e.key=="ArrowLeft")go(-1)};
render();
</script></body></html>
